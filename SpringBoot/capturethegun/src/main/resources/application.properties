spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ctg_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ctg_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ctg_pass}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
