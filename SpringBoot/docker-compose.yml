version: '3.8'

services:
  db:
    image: postgres:17
    container_name: ctg-db
    environment:
      POSTGRES_DB: ctg_db
      POSTGRES_USER: ctg_user
      POSTGRES_PASSWORD: ctg_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
    container_name: ctg-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ctg_db
      SPRING_DATASOURCE_USERNAME: ctg_user
      SPRING_DATASOURCE_PASSWORD: ctg_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  pgdata:
